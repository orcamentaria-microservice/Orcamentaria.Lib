name: publish
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Versão a partir da tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore Orcamentaria.Lib.sln
        env: { NUGET_AUTH_USER: '${{ github.actor }}', NUGET_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: dotnet test Orcamentaria.Lib.sln -c Release --no-restore
      - run: |
          for p in Orcamentaria.Lib.Domain Orcamentaria.Lib.Application Orcamentaria.Lib.Infrastructure Orcamentaria.Lib.Test; do
            dotnet pack $p/$p.csproj -c Release --no-restore -p:Version=$VERSION -o ./out
          done
      - run: dotnet nuget push "./out/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
